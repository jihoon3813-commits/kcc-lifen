<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KCC홈씨씨 · 모바일 화면 미리보기</title>
  <style>
    body { margin: 0; background: #e7eaed; display: flex; justify-content: center; align-items: center; min-height: 100vh; min-height: 100dvh; padding: 18px; box-sizing: border-box; }

      #mframe { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }

  </style>

<body>
  <iframe id="mframe" title="모바일 견적서" src="./quote.html"></iframe>

    if (location.search) {
      document.getElementById('mframe').src = './quote.html' + location.search;
    }
  </script>
